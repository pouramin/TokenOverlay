name: Build TunnelLab TokenOverlay (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Test independent data readers
        shell: pwsh
        run: dotnet run --project tests/Smoke/Smoke.csproj -c Release --nologo

      - name: Build
        shell: pwsh
        run: dotnet build src/TunnelLabOverlay/TokenOverlay.csproj -c Release --nologo

      - name: Publish standalone Windows executable
        shell: pwsh
        run: dotnet publish src/TunnelLabOverlay/TokenOverlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --nologo -o dist

      - name: ZIP and SHA256
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath TunnelLab-TokenOverlay-win-x64.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 TunnelLab-TokenOverlay-win-x64.zip).Hash.ToLowerInvariant()
          "$hash  TunnelLab-TokenOverlay-win-x64.zip" | Set-Content -Path TunnelLab-TokenOverlay-win-x64.zip.sha256 -Encoding ascii
          Write-Host "ZIP SHA256: $hash"

      - uses: actions/upload-artifact@v4
        with:
          name: TunnelLab-TokenOverlay-Windows
          path: |
            TunnelLab-TokenOverlay-win-x64.zip
            TunnelLab-TokenOverlay-win-x64.zip.sha256

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          target_commitish: ${{ github.sha }}
          name: TunnelLab TokenOverlay v1.1.0
          body: "Independent WinForms rewrite. Supports Codex Desktop, Claude Code, and OpenCode. OpenCode displays main-session and cumulative totals including child agent sessions. Local-only, read-only."
          files: |
            TunnelLab-TokenOverlay-win-x64.zip
            TunnelLab-TokenOverlay-win-x64.zip.sha256
