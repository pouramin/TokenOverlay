name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Validate turn timer parser
        shell: pwsh
        run: dotnet run --project tests/TurnTimingSmoke/TurnTimingSmoke.csproj -c Release --nologo

      - name: Test Claude transcript parser
        shell: pwsh
        run: dotnet run --project tests/ClaudeSmoke/ClaudeSmoke.csproj -c Release --nologo

      - name: Build project
        shell: pwsh
        run: dotnet build src/CodexTokenOverlay/CodexTokenOverlay.csproj -c Release --nologo

      - name: Publish Windows standalone
        shell: pwsh
        run: dotnet publish src/CodexTokenOverlay/CodexTokenOverlay.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true --nologo -o dist

      - name: Package ZIP and SHA256
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath TokenOverlay-win-x64.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 TokenOverlay-win-x64.zip).Hash.ToLowerInvariant()
          "$hash  TokenOverlay-win-x64.zip" | Set-Content -Path TokenOverlay-win-x64.zip.sha256 -Encoding ascii
          Write-Host "ZIP SHA256: $hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TokenOverlay-win-x64
          path: |
            TokenOverlay-win-x64.zip
            TokenOverlay-win-x64.zip.sha256

      - name: Publish release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.3.0
          target_commitish: ${{ github.sha }}
          name: TunnelLab TokenOverlay v0.3.0
          body: "Unofficial Windows overlay built from MIT-licensed upstream project by soleillevant0125. Local token usage only; no telemetry."
          files: |
            TokenOverlay-win-x64.zip
            TokenOverlay-win-x64.zip.sha256
